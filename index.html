<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nyx Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ... (keep all CSS from previous version, unchanged) ... */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #07070a;
      --surface: #0e0e13;
      --card: #131318;
      --card-hover: #1a1a21;
      --border: #1e1e28;
      --border-glow: #ff5c3a22;
      --fg: #e4e4e8;
      --fg-dim: #8888a0;
      --fg-muted: #55556a;
      --accent: #ff5c3a;
      --accent-dim: #ff5c3a33;
      --accent-glow: #ff5c3a15;
      --green: #3aff8a;
      --radius: 12px;
      --radius-sm: 8px;
      --font: 'Space Grotesk', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      top: -40%; left: -20%;
      width: 80vw; height: 80vw;
      background: radial-gradient(circle, #ff5c3a08 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #07070ae0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
      cursor: pointer;
    }

    .logo-mark {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      color: #000;
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, #ffffff30);
    }

    .logo-text {
      font-weight: 600;
      font-size: 18px;
      color: var(--fg);
      letter-spacing: -0.3px;
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .nav-tab {
      padding: 6px 16px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-tab:hover { color: var(--fg-dim); }

    .nav-tab.active {
      background: var(--card-hover);
      color: var(--fg);
      box-shadow: 0 1px 4px #00000040;
    }

    .proxy-status {
      margin-left: auto;
      font-size: 12px;
      font-family: var(--mono);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--fg-muted);
      transition: background 0.3s;
    }

    .status-dot.online { background: var(--green); box-shadow: 0 0 8px #3aff8a60; }
    .status-dot.offline { background: #ff3a5c; }

    .view { display: none; }
    .view.active { display: block; }

    main {
      position: relative;
      z-index: 1;
      max-width: 1320px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .game-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .game-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--accent-glow), transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: -1;
    }

    .game-card:hover {
      border-color: var(--accent-dim);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px -12px #00000080, 0 0 0 1px var(--border-glow);
    }

    .game-card:hover::before { opacity: 1; }

    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--surface);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .card-thumb-fallback { font-size: 48px; opacity: 0.25; }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-new { background: var(--accent); color: #000; }

    .card-play-overlay {
      position: absolute;
      inset: 0;
      background: #00000060;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .game-card:hover .card-play-overlay { opacity: 1; }

    .play-icon {
      width: 56px; height: 56px;
      background: var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 24px #ff5c3a60;
      transition: transform 0.2s;
    }

    .game-card:hover .play-icon { transform: scale(1.1); }
    .play-icon svg { margin-left: 3px; }

    .card-info { padding: 14px 16px 16px; }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 12px;
      color: var(--fg-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-meta-dot {
      width: 3px; height: 3px;
      background: var(--fg-muted);
      border-radius: 50%;
    }

    /* ── Proxy view ── */
    .proxy-container {
      position: fixed;
      inset: 0;
      top: 64px;
      z-index: 50;
      background: var(--bg);
      display: none;
      flex-direction: column;
    }

    .proxy-container.active { display: flex; }

    .proxy-url-bar {
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .proxy-url-bar input {
      flex: 1;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .proxy-url-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .proxy-url-bar input::placeholder { color: var(--fg-muted); }

    .proxy-go-btn {
      height: 36px;
      padding: 0 18px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #000;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    .proxy-go-btn:hover { background: #ff6a4a; }
    .proxy-go-btn:active { transform: scale(0.97); }

    .proxy-frame-wrap {
      flex: 1;
      position: relative;
      background: #fff;
    }

    .proxy-frame-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }

    .proxy-offline {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--fg-muted);
    }

    .proxy-offline-icon {
      width: 64px; height: 64px;
      border: 2px solid var(--border);
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
    }

    .proxy-offline-icon svg { width: 28px; height: 28px; opacity: 0.4; }

    .proxy-offline p { font-size: 15px; }
    .proxy-offline code {
      font-family: var(--mono);
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 6px;
      color: var(--fg-dim);
      margin-top: 4px;
    }

    /* ── Player overlay ── */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      display: none;
      flex-direction: column;
    }

    .player-overlay.open {
      display: flex;
      animation: playerIn 0.3s ease-out;
    }

    @keyframes playerIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .player-bar {
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
    }

    .player-back {
      width: 32px; height: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--fg-dim);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
    }

    .player-back:hover {
      background: var(--card-hover);
      color: var(--fg);
      border-color: var(--fg-muted);
    }

    .player-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--fg-dim);
    }

    .player-title strong { color: var(--fg); font-weight: 600; }

    .player-fs {
      margin-left: auto;
      width: 32px; height: 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--fg-dim);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.15s;
    }

    .player-fs:hover { background: var(--card-hover); color: var(--fg); }

    .player-frame-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .player-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 20px;
      font-size: 13px;
      color: var(--fg-dim);
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: var(--mono);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .header-inner { gap: 12px; padding: 0 16px; }
      .logo-text { display: none; }
      .game-grid { grid-template-columns: 1fr; }
      main { padding: 20px 16px 60px; }
      .proxy-status { display: none; }
      .proxy-url-bar { padding: 0 12px; gap: 8px; }
      .proxy-url-bar input { font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo" id="logoHome">
        <div class="logo-mark">N</div>
        <span class="logo-text">Nyx Games</span>
      </div>

      <div class="nav-tabs">
        <button class="nav-tab active" data-view="games">Games</button>
        <button class="nav-tab" data-view="proxy">Proxy</button>
      </div>

      <div class="proxy-status" id="proxyStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">checking...</span>
      </div>
    </div>
  </header>

  <main class="view active" id="gamesView">
    <div class="game-grid" id="gameGrid"></div>
  </main>

  <div class="proxy-container" id="proxyContainer">
    <div class="proxy-url-bar">
      <input type="text" id="proxyUrlInput" placeholder="Enter URL — https://example.com" autocomplete="off" />
      <button class="proxy-go-btn" id="proxyGoBtn">Open</button>
    </div>
    <div class="proxy-frame-wrap" id="proxyFrameWrap">
      <div class="proxy-offline" id="proxyOffline">
        <div class="proxy-offline-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
        </div>
        <p>Proxy server isn't running</p>
        <code>cd proxy-server && node server.js</code>
        <small style="opacity:0.4; margin-top:8px; font-size:12px;">then refresh this page</small>
      </div>
    </div>
  </div>

  <div class="player-overlay" id="playerOverlay">
    <div class="player-bar">
      <button class="player-back" id="playerBack" aria-label="Back to games">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="player-title">Playing <strong id="playerGameTitle"></strong></div>
      <button class="player-fs" id="playerFs" aria-label="Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </button>
    </div>
    <div class="player-frame-wrap" id="playerFrameWrap"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Ultraviolet client bundle (optional, but needed for proxy) -->
  <script src="uv.bundle.js"></script>
  <script src="uv.config.js"></script>

  <script>
  // ── Safe UV detection ──
  const hasUV = typeof Ultraviolet !== 'undefined' && window.__uv$config !== undefined;
  const BARE_URL = hasUV ? window.__uv$config.bare : '/bare/';
  const UV_PREFIX = hasUV ? window.__uv$config.prefix : '/service/';

  // ── Game data ──
  const GAMES = [
    {
      id: 'diceamillion',
      title: 'Dice a Million',
      category: 'Casino',
      badge: 'new',
      icon: '🎲',
      url: 'diceamillion.html'
    }
  ];

  // ── Proxy health check ──
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const proxyContainer = document.getElementById('proxyContainer');
  const proxyFrameWrap = document.getElementById('proxyFrameWrap');
  const proxyOffline = document.getElementById('proxyOffline');
  const proxyUrlInput = document.getElementById('proxyUrlInput');
  const proxyGoBtn = document.getElementById('proxyGoBtn');

  let proxyOnline = false;
  let proxyFrame = null;

  function checkProxy() {
    if (!hasUV) {
      proxyOnline = false;
      statusDot.className = 'status-dot offline';
      statusText.textContent = 'UV not loaded';
      return;
    }
    fetch(BARE_URL, { cache: 'no-store' })
      .then(res => {
        proxyOnline = true;
        statusDot.className = 'status-dot online';
        statusText.textContent = 'proxy online';
      })
      .catch(() => {
        proxyOnline = false;
        statusDot.className = 'status-dot offline';
        statusText.textContent = 'proxy offline';
      });
  }

  checkProxy();
  setInterval(checkProxy, 10000);

  // ── UV encoder ──
  function openProxy(url) {
    if (!hasUV) {
      showToast('UV files missing — copy uv.bundle.js and uv.config.js');
      return;
    }
    if (!proxyOnline) {
      checkProxy();
      showToast('proxy offline — start the server');
      return;
    }

    let target = url.trim();
    if (!target) return;

    if (!/^https?:\/\//i.test(target)) {
      target = 'https://' + target;
    }

    const encoded = encodeURIComponent(
      Ultraviolet.codec.xor.encode(target)
    );

    if (!proxyFrame) {
      proxyFrame = document.createElement('iframe');
      proxyFrame.allow = 'autoplay; fullscreen; clipboard-read; clipboard-write';
      proxyFrame.style.position = 'absolute';
      proxyFrame.style.inset = '0';
      proxyFrame.style.width = '100%';
      proxyFrame.style.height = '100%';
      proxyFrame.style.border = 'none';
      proxyFrame.style.background = '#fff';
      proxyFrameWrap.insertBefore(proxyFrame, proxyFrameWrap.firstChild);
    }

    proxyOffline.style.display = 'none';
    proxyFrame.style.display = 'block';
    proxyFrame.src = UV_PREFIX + encoded;
  }

  proxyGoBtn.addEventListener('click', () => openProxy(proxyUrlInput.value));
  proxyUrlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') openProxy(proxyUrlInput.value);
  });

  // ── Service worker registration ──
  if ('serviceWorker' in navigator && hasUV) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch(() => showToast('sw registration failed'));
  }

  // ── Tab switching ──
  const tabs = document.querySelectorAll('.nav-tab');
  const gamesView = document.getElementById('gamesView');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const view = tab.dataset.view;
      gamesView.classList.toggle('active', view === 'games');
      proxyContainer.classList.toggle('active', view === 'proxy');

      if (view === 'proxy') {
        if (proxyOnline) {
          proxyOffline.style.display = 'none';
          if (proxyFrame) proxyFrame.style.display = 'block';
        } else {
          proxyOffline.style.display = 'flex';
          if (proxyFrame) proxyFrame.style.display = 'none';
          checkProxy();
        }
      }
    });
  });

  document.getElementById('logoHome').addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    document.querySelector('[data-view="games"]').classList.add('active');
    gamesView.classList.add('active');
    proxyContainer.classList.remove('active');
    closePlayer();
  });

  // ── Render game cards ──
  const gameGrid = document.getElementById('gameGrid');
  const PLAY_SVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="#000"><polygon points="6,3 20,12 6,21"/></svg>';

  GAMES.forEach(game => {
    const card = document.createElement('article');
    card.className = 'game-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');

    let badgeHTML = '';
    if (game.badge === 'new') badgeHTML = '<span class="card-badge badge-new">New</span>';

    card.innerHTML =
      '<div class="card-thumb">' +
        '<span class="card-thumb-fallback">' + game.icon + '</span>' +
        badgeHTML +
        '<div class="card-play-overlay"><div class="play-icon">' + PLAY_SVG + '</div></div>' +
      '</div>' +
      '<div class="card-info">' +
        '<div class="card-title">' + game.title + '</div>' +
        '<div class="card-meta">' +
          '<span>' + game.category + '</span>' +
          '<span class="card-meta-dot"></span>' +
          '<span>Unblocked</span>' +
        '</div>' +
      '</div>';

    const openGame = () => launchGame(game);
    card.addEventListener('click', openGame);
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openGame(); } });
    gameGrid.appendChild(card);
  });

  // ── Game player ──
  const overlay = document.getElementById('playerOverlay');
  const frameWrap = document.getElementById('playerFrameWrap');
  const playerGameTitle = document.getElementById('playerGameTitle');

  document.getElementById('playerBack').addEventListener('click', closePlayer);
  document.getElementById('playerFs').addEventListener('click', () => {
    const el = document.getElementById('playerFrameWrap');
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closePlayer();
  });

  function closePlayer() {
    overlay.classList.remove('open');
    setTimeout(() => { frameWrap.innerHTML = ''; }, 300);
  }

  function launchGame(game) {
    playerGameTitle.textContent = game.title;
    frameWrap.innerHTML = '';
    const iframe = document.createElement('iframe');
    iframe.src = game.url;
    iframe.allow = 'autoplay; fullscreen';
    iframe.sandbox = 'allow-scripts allow-same-origin allow-popups';
    frameWrap.appendChild(iframe);
    overlay.classList.add('open');
    showToast('loading ' + game.title.toLowerCase());
  }

  // ── Toast ──
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }
  </script>
</body>
</html>
